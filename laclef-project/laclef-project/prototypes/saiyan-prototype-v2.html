<!DOCTYPE html><html><head><meta charset="utf-8"><style>
body{background:#0e0e10;margin:0;font-family:Inter,sans-serif;color:#ece7df;padding:20px}
.row{display:flex;flex-wrap:wrap;gap:20px;justify-content:center}
.cell{text-align:center;background:#16161a;border:1px solid #2c2c34;border-radius:14px;padding:14px;width:140px}
.cell .nm{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:#9a948a;margin-top:6px;font-weight:600}
.cell .fr{font-size:12.5px;color:var(--accent,#e0a740);font-style:italic;margin-top:2px}
.stage{width:104px;height:116px;margin:0 auto}
h3{text-align:center;color:#9a948a;font-weight:600;letter-spacing:.1em;text-transform:uppercase;font-size:12px;margin:24px 0 10px}
/* mini topbar preview */
.topbar{display:flex;align-items:center;gap:10px;background:#16161a;border:1px solid #2c2c34;border-radius:10px;padding:8px 12px;max-width:340px;margin:10px auto}
.mini{width:40px;height:44px;flex:0 0 auto}
.xpwrap{flex:1}
.xprow{display:flex;justify-content:space-between;font-size:10px;color:#9a948a;font-weight:600;letter-spacing:.04em;margin-bottom:3px}
.xpbar{height:6px;background:#0e0e10;border:1px solid #2c2c34;border-radius:4px;overflow:hidden}
.xpbar>i{display:block;height:100%;background:linear-gradient(90deg,#e0a740,#fff2cc);width:62%}
.lvlbadge{font-size:11px;font-weight:700;color:#e0a740}
</style></head><body>
<h3>Refined forms — Amber</h3>
<div class="row" id="amber"></div>
<h3>Top-bar preview (Lv 3)</h3>
<div class="topbar">
  <div class="mini" id="miniSaiyan"></div>
  <div class="xpwrap">
    <div class="xprow"><span class="lvlbadge">Lv 3 · Ascendant</span><span>2400 / 3600 XP</span></div>
    <div class="xpbar"><i></i></div>
  </div>
</div>
<script>
function saiyanSVG(level, accent, accent2, scale){
  const L=level;
  const cx=52, headTop=44, headW=30, headR=12;
  // FEWER, BOLDER, FLOWING spikes that grow with level
  const nSpikes = Math.min(3 + L, 7);
  const hairH = 10 + L*6;
  let spikes=[];
  for(let i=0;i<nSpikes;i++){
    const t=i/(nSpikes-1);                  // 0..1 across head
    const baseX = cx - headW/2 + headW*t;
    // center spikes taller, flowing outward
    const lean = (t-0.5)*22*(0.5+L*0.12);   // outward lean grows with level
    const h = hairH*(0.6+0.4*Math.sin(t*Math.PI)) + (L>=2?Math.random()*0:0);
    const tipX = baseX + lean;
    const tipY = headTop - 6 - h;
    const bw = headW/nSpikes*0.62;          // base width of each spike
    spikes.push(`M ${(baseX-bw).toFixed(1)} ${headTop-4} Q ${baseX.toFixed(1)} ${(headTop-6-h*0.5).toFixed(1)} ${tipX.toFixed(1)} ${tipY.toFixed(1)} Q ${(baseX+bw*0.4).toFixed(1)} ${(headTop-6-h*0.5).toFixed(1)} ${(baseX+bw).toFixed(1)} ${headTop-4} Z`);
  }
  const hairColor = L===0 ? "#3a2f25" : accent;
  const auraOpacity = 0.07 + L*0.055;
  const auraR = 40 + L*4;
  // rays
  let rays="";
  if(L>=1){for(let a=0;a<14;a++){const ang=a*(360/14)*Math.PI/180;const r1=auraR-4,r2=auraR+7+L*2;rays+=`<line x1="${(cx+Math.cos(ang)*r1).toFixed(1)}" y1="${(66+Math.sin(ang)*r1).toFixed(1)}" x2="${(cx+Math.cos(ang)*r2).toFixed(1)}" y2="${(66+Math.sin(ang)*r2).toFixed(1)}" stroke="${accent}" stroke-width="1.6" stroke-linecap="round" opacity="${0.2+L*0.04}"><animate attributeName="opacity" values="${0.1+L*0.03};${0.4+L*0.04};${0.1+L*0.03}" dur="${1.1+a*0.04}s" repeatCount="indefinite"/></line>`;}}
  let bolts="";
  if(L>=4){bolts=`<path d="M28 48 L34 62 L29 62 L36 78" stroke="${accent2}" stroke-width="2" fill="none"><animate attributeName="opacity" values="0;0.95;0" dur="0.8s" repeatCount="indefinite"/></path><path d="M76 48 L70 62 L75 62 L68 78" stroke="${accent2}" stroke-width="2" fill="none"><animate attributeName="opacity" values="0;0.95;0" dur="0.7s" repeatCount="indefinite" begin="0.35s"/></path>`;}
  const glow = L>=2 ? `filter="url(#glow${L})"` : "";
  return `<svg class="${scale||'stage'}" viewBox="0 0 104 116" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <radialGradient id="aura${L}_${scale||'s'}" cx="50%" cy="56%" r="55%">
        <stop offset="0%" stop-color="${accent}" stop-opacity="${auraOpacity+0.12}"/>
        <stop offset="55%" stop-color="${accent}" stop-opacity="${auraOpacity}"/>
        <stop offset="100%" stop-color="${accent}" stop-opacity="0"/>
      </radialGradient>
      <filter id="glow${L}"><feGaussianBlur stdDeviation="1.4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    </defs>
    <ellipse cx="52" cy="66" rx="${auraR}" ry="${auraR+7}" fill="url(#aura${L}_${scale||'s'})"><animate attributeName="rx" values="${auraR};${auraR+3};${auraR}" dur="2.2s" repeatCount="indefinite"/></ellipse>
    ${rays}${bolts}
    <g><animateTransform attributeName="transform" type="translate" values="0 0; 0 -2.2; 0 0" dur="2.5s" repeatCount="indefinite"/>
      <!-- legs -->
      <path d="M46 86 L43 104 M58 86 L61 104" stroke="#3f4a5c" stroke-width="6.5" stroke-linecap="round"/>
      <!-- boots -->
      <path d="M40 103 L46 103 M56 103 L62 103" stroke="#e8612c" stroke-width="5" stroke-linecap="round"/>
      <!-- torso gi -->
      <path d="M38 64 Q52 58 66 64 L63 88 Q52 92 41 88 Z" fill="#e8612c"/>
      <path d="M38 64 Q52 58 66 64 L65 70 Q52 65 39 70 Z" fill="#c44d20"/>
      <path d="M52 60 L52 89" stroke="#c44d20" stroke-width="1.4" opacity="0.6"/>
      <!-- belt -->
      <rect x="40" y="84" width="24" height="5" rx="2" fill="#23408a"/>
      <!-- arms -->
      <path d="M40 66 L32 82 M64 66 L72 82" stroke="#f0c9a0" stroke-width="6" stroke-linecap="round"/>
      <!-- fists -->
      <circle cx="31" cy="83" r="3.4" fill="#f0c9a0"/><circle cx="73" cy="83" r="3.4" fill="#f0c9a0"/>
      <!-- head -->
      <circle cx="52" cy="50" r="${headR}" fill="#f0c9a0"/>
      <!-- ears -->
      <circle cx="40" cy="50" r="2.4" fill="#f0c9a0"/><circle cx="64" cy="50" r="2.4" fill="#f0c9a0"/>
      <!-- face -->
      <ellipse cx="47.5" cy="49" rx="1.5" ry="2.3" fill="#1c1a17"/><ellipse cx="56.5" cy="49" rx="1.5" ry="2.3" fill="#1c1a17"/>
      <path d="M48 56 Q52 58 56 56" stroke="#1c1a17" stroke-width="1.2" fill="none" stroke-linecap="round"/>
      <!-- hair spikes -->
      <g ${glow}>${spikes.map(s=>`<path d="${s}" fill="${hairColor}"/>`).join("")}</g>
      ${L>=1?`<g opacity="0.45">${spikes.map(s=>`<path d="${s}" fill="${accent2}"/>`).join("")}</g>`:""}
    </g>
  </svg>`;
}
const forms=[["Base","Apprenti"],["Kaioken","Éveil"],["Super Saiyan","Super Saïyen"],["Ascended","Ascendant"],["Super Saiyan 2","Foudre"],["Super Saiyan 3","Crinière"],["Ultra","Maître Ultra"]];
const amber=document.getElementById("amber");
forms.forEach((f,i)=>{const d=document.createElement("div");d.className="cell";d.style.setProperty("--accent","#e0a740");d.innerHTML=saiyanSVG(i,"#e0a740","#fff2cc")+`<div class="nm">Lv ${i} · ${f[0]}</div><div class="fr">${f[1]}</div>`;amber.appendChild(d);});
document.getElementById("miniSaiyan").innerHTML=saiyanSVG(3,"#e0a740","#fff2cc","mini");
</script></body></html>
