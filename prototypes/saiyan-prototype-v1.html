<!DOCTYPE html><html><head><meta charset="utf-8"><style>
body{background:#0e0e10;margin:0;font-family:Inter,sans-serif;color:#ece7df;padding:20px}
.row{display:flex;flex-wrap:wrap;gap:24px;justify-content:center}
.cell{text-align:center;background:#16161a;border:1px solid #2c2c34;border-radius:14px;padding:16px;width:150px}
.cell .nm{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:#9a948a;margin-top:8px;font-weight:600}
.cell .fr{font-size:13px;color:var(--accent,#e0a740);font-style:italic;margin-top:2px}
.stage{width:110px;height:120px;margin:0 auto}
h3{text-align:center;color:#9a948a;font-weight:600;letter-spacing:.1em;text-transform:uppercase;font-size:12px;margin:28px 0 10px}
</style></head><body>
<h3>Forms — Amber theme</h3>
<div class="row" id="amber"></div>
<h3>Same form (Ultra) across 4 themes</h3>
<div class="row" id="themes"></div>
<script>
// ---- The Saiyan SVG generator ----
// level 0..6; aura intensity & hair grow with level. Colors from CSS vars (theme).
function saiyanSVG(level, accent, accent2){
  const L=level;
  // hair height grows with level
  const hairH = 14 + L*5;            // spike height
  const spikes = 5 + Math.min(L,4);  // number of spikes
  const auraOpacity = 0.08 + L*0.06;
  const auraR = 42 + L*4;
  // hair color: base dark -> golden/themed as it ascends
  const hairColor = L===0 ? "#3a2f25" : accent;
  const hairGlow = L>=2 ? accent2 : "none";
  // build spiky hair as a polygon
  let spikePts=[];
  const cx=55, headTop=42, headW=34;
  for(let i=0;i<=spikes;i++){
    const x = cx - headW/2 + (headW)*(i/spikes);
    const up = (i%2===0) ? hairH : hairH*0.55;
    spikePts.push(`${x.toFixed(1)},${(headTop-up).toFixed(1)}`);
    if(i<spikes){
      const xm = cx - headW/2 + (headW)*((i+0.5)/spikes);
      spikePts.push(`${xm.toFixed(1)},${(headTop-2).toFixed(1)}`);
    }
  }
  const hairPoly = `${(cx-headW/2).toFixed(1)},${headTop} ` + spikePts.join(" ") + ` ${(cx+headW/2).toFixed(1)},${headTop}`;

  // aura rays for higher levels
  let rays="";
  if(L>=1){
    for(let a=0;a<12;a++){
      const ang=a*30*Math.PI/180;
      const r1=auraR-6, r2=auraR+8+(L*2);
      const x1=cx+Math.cos(ang)*r1, y1=70+Math.sin(ang)*r1;
      const x2=cx+Math.cos(ang)*r2, y2=70+Math.sin(ang)*r2;
      rays+=`<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" stroke="${accent}" stroke-width="2" stroke-linecap="round" opacity="${0.25+L*0.05}"><animate attributeName="opacity" values="${0.15+L*0.04};${0.45+L*0.05};${0.15+L*0.04}" dur="${1.2+a*0.05}s" repeatCount="indefinite"/></line>`;
    }
  }
  // lightning for L>=4
  let bolts="";
  if(L>=4){
    bolts=`<path d="M30 50 L36 64 L31 64 L38 80" stroke="${accent2}" stroke-width="2" fill="none" opacity="0.7"><animate attributeName="opacity" values="0;0.9;0" dur="0.8s" repeatCount="indefinite"/></path>
           <path d="M80 50 L74 64 L79 64 L72 80" stroke="${accent2}" stroke-width="2" fill="none" opacity="0.7"><animate attributeName="opacity" values="0;0.9;0" dur="0.7s" repeatCount="indefinite" begin="0.3s"/></path>`;
  }

  return `<svg class="stage" viewBox="0 0 110 120" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <radialGradient id="aura${L}" cx="50%" cy="58%" r="55%">
        <stop offset="0%" stop-color="${accent}" stop-opacity="${auraOpacity+0.1}"/>
        <stop offset="60%" stop-color="${accent}" stop-opacity="${auraOpacity}"/>
        <stop offset="100%" stop-color="${accent}" stop-opacity="0"/>
      </radialGradient>
      ${hairGlow!=="none"?`<filter id="glow${L}"><feGaussianBlur stdDeviation="1.6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>`:""}
    </defs>
    <!-- aura -->
    <ellipse cx="55" cy="70" rx="${auraR}" ry="${auraR+6}" fill="url(#aura${L})">
      <animate attributeName="rx" values="${auraR};${auraR+3};${auraR}" dur="2.2s" repeatCount="indefinite"/>
    </ellipse>
    ${rays}
    ${bolts}
    <!-- body group: gentle idle bob -->
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 -2.5; 0 0" dur="2.4s" repeatCount="indefinite"/>
      <!-- legs -->
      <rect x="47" y="92" width="6" height="16" rx="3" fill="#2b6cb0" opacity="0"/>
      <path d="M48 88 L45 106 M62 88 L65 106" stroke="#4a5568" stroke-width="6" stroke-linecap="round"/>
      <!-- torso (gi) -->
      <path d="M40 66 Q55 60 70 66 L67 90 Q55 94 43 90 Z" fill="#e8612c"/>
      <path d="M40 66 Q55 60 70 66 L68 72 Q55 67 42 72 Z" fill="#c44d20"/>
      <!-- belt -->
      <rect x="42" y="86" width="26" height="5" rx="2" fill="#23408a"/>
      <!-- arms -->
      <path d="M41 68 L33 84 M69 68 L77 84" stroke="#f0c9a0" stroke-width="6" stroke-linecap="round"/>
      <!-- head -->
      <circle cx="55" cy="52" r="13" fill="#f0c9a0"/>
      <!-- face -->
      <ellipse cx="50" cy="51" rx="1.6" ry="2.4" fill="#1c1a17"/>
      <ellipse cx="60" cy="51" rx="1.6" ry="2.4" fill="#1c1a17"/>
      <path d="M51 58 Q55 60 59 58" stroke="#1c1a17" stroke-width="1.3" fill="none" stroke-linecap="round"/>
      <!-- hair -->
      <polygon points="${hairPoly}" fill="${hairColor}" ${hairGlow!=="none"?`filter="url(#glow${L})"`:""}>
        ${L>=3?`<animate attributeName="points" values="${hairPoly};${hairPoly}" dur="0.3s"/>`:""}
      </polygon>
      ${L>=1?`<polygon points="${hairPoly}" fill="${accent}" opacity="0.5"/>`:""}
    </g>
  </svg>`;
}

const forms=[["Base","Apprenti"],["Kaioken","Éveil"],["Super Saiyan","Super Saïyen"],["Ascended","Ascendant"],["Super Saiyan 2","Foudre"],["Super Saiyan 3","Crinière"],["Ultra","Maître Ultra"]];
const A="#e0a740", A2="#fff2cc";
const amber=document.getElementById("amber");
forms.forEach((f,i)=>{
  const d=document.createElement("div");d.className="cell";d.style.setProperty("--accent",A);
  d.innerHTML=saiyanSVG(i,A,A2)+`<div class="nm">Lv ${i} · ${f[0]}</div><div class="fr">${f[1]}</div>`;
  amber.appendChild(d);
});
const themes=[["Amber","#e0a740","#fff2cc"],["Teal","#4fd1c5","#c4fff8"],["Crimson","#e0533f","#ffd9d2"],["Mono","#d9d4cb","#ffffff"]];
const tc=document.getElementById("themes");
themes.forEach(t=>{
  const d=document.createElement("div");d.className="cell";d.style.setProperty("--accent",t[1]);
  d.innerHTML=saiyanSVG(6,t[1],t[2])+`<div class="nm">${t[0]}</div><div class="fr">Maître Ultra</div>`;
  tc.appendChild(d);
});
</script></body></html>
